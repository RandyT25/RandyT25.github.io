name: Update Kuta-Seminyak Dashboard Data

on:
  push:
    branches: [main]
    paths:
      - "*.xlsx"
      - "monthly_targets.json"
      - "scripts/parse_global_sales.py"
      - "scripts/build_dashboard.py"
      - "scripts/dashboard_template.html"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Parse latest sales export
        run: python scripts/parse_global_sales.py

      - name: Rebuild dashboard
        run: python scripts/build_dashboard.py

      - name: Commit and push regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html dashboard.html
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "auto: refresh Kuta-Seminyak dashboard data [skip ci]" && git push
